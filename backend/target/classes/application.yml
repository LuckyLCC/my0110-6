server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oxygen_capsule?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        # 不创建外键约束
        hbm2ddl.import_files_sql_extractor: org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
        temp.use_jdbc_metadata_defaults: false
      javax:
        persistence:
          validation:
            mode: none

  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.oxygen.capsule: debug
    org.springframework.web: debug

jwt:
  secret: 8a9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d
  expiration: 86400000 # 24小时

wechat:
  miniapp:
    appid: wx1a44cbe925471245
    secret: 019d069035074ed1c45d1c35d69ed8c2
  pay:
    mock: true  # 是否使用mock模式（true=使用mock数据，false=使用真实微信支付）
    appid: wx1a44cbe925471245  # 小程序 AppID（以 wx 开头）
    mchid: 1234567890  # 商户号（纯数字，8-10位），请替换为你的真实商户号
    apiKey: your-api-key-here  # API密钥，请替换为你的真实API密钥
    certPath: classpath:cert/apiclient_cert.p12  # 证书路径（可选，用于RSA签名）
    notifyUrl: https://your-domain.com/api/payment/notify  # 支付回调URL（必须是HTTPS）

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.oxygen.capsule.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl