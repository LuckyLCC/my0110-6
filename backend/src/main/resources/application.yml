server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oxygen_capsule?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.oxygen.capsule: debug
    org.springframework.web: debug

jwt:
  secret: oxygenCapsuleSecretKey
  expiration: 86400000 # 24小时

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.oxygen.capsule.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl